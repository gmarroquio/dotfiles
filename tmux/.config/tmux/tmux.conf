# Unbind keys
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g prefix C-a
bind C-a send-prefix
# Unbind end

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set-option -g status-interval 5

set-option -sa terminal-overrides ',xterm-256color:RGB'

# window name
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# use <prefix> s for horizontal split
bind _ split-window -v -c "#{pane_current_path}"
# use <prefix> v for vertical split
bind | split-window -h -c "#{pane_current_path}"
bind T split-window -h -c "#{pane_current_path}" -l 30%
bind H split-window -v -c "#{pane_current_path}" -l 20%

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes more easily
# horizontaly
bind < resize-pane -L 10
bind > resize-pane -R 10
# vertically
bind - resize-pane -D 10
bind + resize-pane -U 10

bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"
# Status line
set-option -g status-position top
# set-option -g status-right "%H:%M %d-%b-%y"
# set-option -g status-style bg=colour0
#
# setw -g window-status-current-style 'fg=colour214 bg=colour236 bold'
# setw -g window-status-current-format '#[fg=colour0 bg=colour236]#[fg=default bg=default] #I#[fg=colour7]:#[fg=colour7]#W\
# #[fg=colour249]#{?window_zoomed_flag,🔍, }#[fg=colour236 bg=colour0]'
#
# setw -g window-status-style 'fg=colour214 bg=default'
# setw -g window-status-format ' #[fg=default]#I#[fg=colour7]:#[fg=colour7]#W#[fg=colour249]#F'
# Refresh status line every 5 seconds - Good for when music is playing / update time etc
set -g status-interval 5

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 0

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

set-option -g status "on"

# Default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1

# Default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# Active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# Set active pane border color
set-option -g pane-active-border-style fg=colour214

# Set inactive pane border color
set-option -g pane-border-style fg=colour239

# Message info
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# Writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# Pane number display
set-option -g display-panes-active-colour colour1 #fg2
set-option -g display-panes-colour colour237 #bg1

# Clock
set-window-option -g clock-mode-colour colour109 #blue

# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

set-option -g status-left "\
#[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],}  #S \
#[fg=colour241, bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag,  ,}"

set-option -g status-right "\
#[fg=colour214, bg=colour237] \
#[fg=colour237, bg=colour214] #(~/dotfiles/tmux_scripts/music.sh) \
#[fg=colour223, bg=colour237] #(~/dotfiles/tmux_scripts/uptime.sh) \
#[fg=colour246, bg=colour237]  %d %b '%y\
#[fg=colour109]  %H:%M \
#[fg=colour248, bg=colour239]"

set-window-option -g window-status-current-format "\
#[fg=colour237, bg=colour214]\
#[fg=colour239, bg=colour214] #I* \
#[fg=colour239, bg=colour214, bold] #W \
#[fg=colour214, bg=colour237]"

set-window-option -g window-status-format "\
#[fg=colour237,bg=colour239,noitalics]\
#[fg=colour223,bg=colour239] #I \
#[fg=colour223, bg=colour239] #W \
#[fg=colour239, bg=colour237]"
# Status line end

set -g mouse on
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"
set -g @scroll-down-exit-copy-mode "on"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
